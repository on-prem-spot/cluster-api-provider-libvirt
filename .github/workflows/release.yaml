name: Release

# Release tags (v*): unit + e2e tests, build/sign/attest/scan the image with
# semver tags, build the CAPI provider release manifests, generate SLSA
# provenance, and upload everything to a DRAFT GitHub release.
#
# All of this runs in one workflow run so the release job can download the
# artifacts (docker-sbom, trivy-report, release-manifests, provenance)
# produced by the earlier jobs, including those in the called workflows.
# The SLSA generator is called from here, not from a nested reusable
# workflow.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# Never cancel a release in progress; serialize reruns of the same tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  # ─────────────────────────────────────────────────────────────────────────────
  # Extract version; downstream jobs depend on this.
  # ─────────────────────────────────────────────────────────────────────────────
  extract-version:
    name: Extract Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag-name }}
      image-tag: ${{ steps.version.outputs.image-tag }}
      image-repository: ${{ steps.version.outputs.image-repository }}
      short-sha: ${{ steps.version.outputs.short-sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        uses: ./.github/actions/extract-version
        with:
          repository: ${{ github.repository }}
          workflow-type: release
          release-tag: ${{ github.ref_name }}

  test:
    name: Test
    needs: [extract-version]
    uses: ./.github/workflows/test.yaml

  image:
    name: Image
    needs: [extract-version, test]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: ./.github/workflows/image.yaml
    with:
      version: ${{ needs.extract-version.outputs.version }}
      image-tag: ${{ needs.extract-version.outputs.image-tag }}
      short-sha: ${{ needs.extract-version.outputs.short-sha }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Build the CAPI provider release manifests
  # (infrastructure-components.yaml + metadata.yaml) per the clusterctl
  # provider contract: https://cluster-api.sigs.k8s.io/clusterctl/provider-contract.html
  # ─────────────────────────────────────────────────────────────────────────────
  package-deploy-manifests:
    name: Build Provider Release Manifests
    runs-on: ubuntu-latest
    needs: [extract-version]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Generate manifests
        run: make manifests

      - name: Build infrastructure-components.yaml
        run: make build-installer IMG=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ needs.extract-version.outputs.version }}

      - name: Stage release manifests
        run: |
          mkdir -p release-manifests
          cp dist/infrastructure-components.yaml release-manifests/
          cp metadata.yaml release-manifests/
          cp templates/cluster-template.yaml release-manifests/

      - name: Upload release manifests
        uses: actions/upload-artifact@v4
        with:
          name: release-manifests
          path: release-manifests/

  # ─────────────────────────────────────────────────────────────────────────────
  # Generate SLSA Level 3 provenance.
  # ─────────────────────────────────────────────────────────────────────────────
  generate-provenance-subjects:
    name: Generate SLSA Provenance Subjects
    runs-on: ubuntu-latest
    needs: [package-deploy-manifests, extract-version]
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Download release manifests
        uses: actions/download-artifact@v4
        with:
          name: release-manifests
          path: ./artifacts

      - name: Generate hashes for SLSA provenance
        id: hash
        run: |
          cd artifacts
          sha256sum infrastructure-components.yaml metadata.yaml cluster-template.yaml > checksums.txt
          cat checksums.txt
          echo "hashes=$(cat checksums.txt | base64 -w0)" >> "$GITHUB_OUTPUT"

  slsa-provenance:
    name: Generate SLSA Provenance
    needs: [generate-provenance-subjects, extract-version]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.generate-provenance-subjects.outputs.hashes }}"
      # upload-assets must be false because the GitHub release does not yet
      # exist when this job runs — upload-release-assets creates a draft and
      # attaches the provenance artifact alongside the other files.
      upload-assets: false
      provenance-name: "${{ needs.extract-version.outputs.version }}.intoto.jsonl"

  # ─────────────────────────────────────────────────────────────────────────────
  # Collate all artifacts and upload to the GitHub Release.
  # ─────────────────────────────────────────────────────────────────────────────
  upload-release-assets:
    name: Upload Release Assets
    runs-on: ubuntu-latest
    # "image" covers the docker, attest and trivy jobs of image.yaml.
    needs: [image, slsa-provenance, package-deploy-manifests]
    permissions:
      contents: write
    steps:
      # Check out the repo (CHANGELOG.md only) so the release notes can be
      # extracted from it below.
      - name: Check out source
        uses: actions/checkout@v4
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      # Extract the release notes for this tag from CHANGELOG.md — the section
      # under "## [<version>]" up to the next "## " heading. Falls back to a
      # placeholder if no matching section is found so the release still has a
      # body.
      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {f=1; next}
            /^## / {f=0}
            f' CHANGELOG.md | sed '/./,$!d' > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "See CHANGELOG.md for details." > release-notes.md
          fi
          echo "::group::Release notes"
          cat release-notes.md
          echo "::endgroup::"

      # Download only the artifacts we actually attach to the release.
      # An unfiltered download also pulls the *.dockerbuild metadata blob
      # produced by docker/build-push-action with sbom/provenance enabled,
      # which we never use and which has caused transient artifact-CDN
      # download failures that fail the whole job.
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          pattern: "{release-manifests,docker-sbom,trivy-report,*.intoto.jsonl}"

      - name: Organize release artifacts
        run: |
          cd artifacts
          mkdir -p release sboms provenance

          # Copy CAPI provider release manifests
          if [ -f "release-manifests/infrastructure-components.yaml" ]; then
            cp release-manifests/infrastructure-components.yaml release/
          fi
          if [ -f "release-manifests/metadata.yaml" ]; then
            cp release-manifests/metadata.yaml release/
          fi
          if [ -f "release-manifests/cluster-template.yaml" ]; then
            cp release-manifests/cluster-template.yaml release/
          fi

          # Copy Docker SBOM
          if [ -d "docker-sbom" ] && [ -f "docker-sbom/docker-sbom.json" ]; then
            cp docker-sbom/docker-sbom.json sboms/
          fi

          # Copy Trivy report
          if [ -d "trivy-report" ] && [ -f "trivy-report/trivy-results.sarif" ]; then
            cp trivy-report/trivy-results.sarif sboms/
          fi

          # Copy SLSA provenance
          find . -name "*.intoto.jsonl" -type f -exec cp {} provenance/ \;

          # Generate SHA256 checksums
          cd release
          sha256sum * > checksums.sha256 2>/dev/null || true
          cd ../sboms
          sha256sum * >> ../release/checksums.sha256 2>/dev/null || true
          cd ../provenance
          if compgen -G "*.intoto.jsonl" > /dev/null 2>&1; then
            sha256sum *.intoto.jsonl >> ../release/checksums.sha256
          fi

          echo "Release artifacts:"
          ls -lhR ../

      # Create a DRAFT release the maintainer reviews and then publishes
      # manually. The action creates the release if it does not yet exist for
      # the tag, attaches the files, and leaves it unpublished. This matches
      # the CAPI ecosystem convention (see cluster-api-provider-vsphere) and
      # prevents a half-built release from going public if any earlier job
      # in the workflow fails.
      - name: Upload release assets (draft)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          draft: true
          files: |
            artifacts/release/infrastructure-components.yaml
            artifacts/release/metadata.yaml
            artifacts/release/cluster-template.yaml
            artifacts/sboms/*
            artifacts/provenance/*.intoto.jsonl
            artifacts/release/checksums.sha256
