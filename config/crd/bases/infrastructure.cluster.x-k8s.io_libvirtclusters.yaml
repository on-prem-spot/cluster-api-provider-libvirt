---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: libvirtclusters.infrastructure.cluster.x-k8s.io
spec:
  group: infrastructure.cluster.x-k8s.io
  names:
    categories:
    - cluster-api
    kind: LibvirtCluster
    listKind: LibvirtClusterList
    plural: libvirtclusters
    shortNames:
    - libvirtcl
    singular: libvirtcluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.ready
      name: Ready
      type: boolean
    - jsonPath: .spec.controlPlaneEndpoint.host
      name: Endpoint
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          LibvirtCluster is the Schema for the libvirtclusters API.
          It fulfills the Cluster API infrastructure cluster contract.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of LibvirtCluster.
            properties:
              baseImage:
                description: |-
                  baseImage, when set, lets the controller distribute the cluster's
                  root-disk qcow2 base image to every libvirt host that runs a machine in
                  this cluster. The image is fetched once into the controller-local cache
                  and SCP'd onto each host as needed; subsequent machines on the same
                  host reuse the already-staged volume. Hosts no longer need the qcow2
                  pre-staged via Ansible.
                properties:
                  pool:
                    description: |-
                      Pool is the libvirt storage pool name on each host where the image is
                      staged. Must exist on every LibvirtHost in the cluster.
                    minLength: 1
                    pattern: ^[A-Za-z0-9_.:-]+$
                    type: string
                  source:
                    description: |-
                      Source describes where to fetch the qcow2 from. Gzip-wrapped payloads
                      (URL ending in .gz, OCI mediaType application/gzip, or any blob whose
                      first two bytes are 0x1f 0x8b) are decompressed transparently before
                      the digest is computed.
                    properties:
                      https:
                        description: HTTPSBaseImageSource fetches the qcow2 over HTTPS.
                        properties:
                          credentialsSecretRef:
                            description: |-
                              CredentialsSecretRef is a Secret with `username`/`password` keys for
                              HTTP Basic auth, or the kubernetes.io/dockerconfigjson layout.
                            properties:
                              name:
                                description: Name of the Secret.
                                minLength: 1
                                type: string
                              namespace:
                                description: |-
                                  Namespace of the Secret. Deprecated: the Secret must live in the
                                  LibvirtCluster's own namespace, so the only accepted values are "" and
                                  that namespace. Naming any other namespace is rejected — the controller
                                  reads Secrets with cluster-wide RBAC and this spec also chooses the
                                  endpoint the credential is sent to, so an unconfined reference here is a
                                  credential-exfiltration primitive.
                                type: string
                            required:
                            - name
                            type: object
                          insecureSkipTLSVerify:
                            description: |-
                              InsecureSkipTLSVerify disables TLS certificate verification when
                              fetching the qcow2. Intended only for development or self-signed
                              endpoints; prefer adding the serving CA to the controller's trust
                              store (e.g. via SSL_CERT_FILE) for production mirrors.
                            type: boolean
                          sha256:
                            description: |-
                              SHA256 of the decompressed qcow2. Optional but strongly recommended
                              when the URL is mutable; pinned digests prevent accidental version
                              drift across the fleet.
                            type: string
                          url:
                            description: |-
                              URL is the https:// (or http:// when explicitly allowed by the
                              caller's network policy) URL to the qcow2 file.
                            type: string
                        required:
                        - url
                        type: object
                      oci:
                        description: |-
                          OCIBaseImageSource fetches the qcow2 from a single-blob OCI artifact.
                          The manifest is expected to contain one layer carrying the qcow2; if the
                          layer is annotated with `org.opencontainers.image.title`, BlobTitle
                          selects it, otherwise the single layer is taken implicitly.
                        properties:
                          blobTitle:
                            description: |-
                              BlobTitle is the `org.opencontainers.image.title` annotation
                              identifying the qcow2 layer. When empty and the manifest has exactly
                              one layer, that layer is selected automatically.
                            type: string
                          credentialsSecretRef:
                            description: CredentialsSecretRef references a Secret
                              holding registry credentials.
                            properties:
                              name:
                                description: Name of the Secret.
                                minLength: 1
                                type: string
                              namespace:
                                description: |-
                                  Namespace of the Secret. Deprecated: the Secret must live in the
                                  LibvirtCluster's own namespace, so the only accepted values are "" and
                                  that namespace. Naming any other namespace is rejected — the controller
                                  reads Secrets with cluster-wide RBAC and this spec also chooses the
                                  endpoint the credential is sent to, so an unconfined reference here is a
                                  credential-exfiltration primitive.
                                type: string
                            required:
                            - name
                            type: object
                          insecureSkipTLSVerify:
                            description: InsecureSkipTLSVerify disables TLS certificate
                              verification.
                            type: boolean
                          plainHTTP:
                            description: PlainHTTP allows non-TLS pulls from the registry.
                            type: boolean
                          reference:
                            description: Reference is the full OCI reference, e.g.
                              "ghcr.io/example/rhcos:4.18".
                            type: string
                          sha256:
                            description: SHA256 of the decompressed qcow2. Optional
                              but recommended.
                            type: string
                        required:
                        - reference
                        type: object
                      s3:
                        description: S3BaseImageSource fetches the qcow2 from an S3-compatible
                          object store.
                        properties:
                          bucket:
                            type: string
                          credentialsSecretRef:
                            description: CredentialsSecretRef references a Secret
                              holding static credentials.
                            properties:
                              name:
                                description: Name of the Secret.
                                minLength: 1
                                type: string
                              namespace:
                                description: |-
                                  Namespace of the Secret. Deprecated: the Secret must live in the
                                  LibvirtCluster's own namespace, so the only accepted values are "" and
                                  that namespace. Naming any other namespace is rejected — the controller
                                  reads Secrets with cluster-wide RBAC and this spec also chooses the
                                  endpoint the credential is sent to, so an unconfined reference here is a
                                  credential-exfiltration primitive.
                                type: string
                            required:
                            - name
                            type: object
                          endpoint:
                            description: Endpoint is the S3 endpoint host[:port].
                            type: string
                          insecure:
                            description: Insecure switches the endpoint to plain HTTP.
                            type: boolean
                          insecureSkipTLSVerify:
                            description: InsecureSkipTLSVerify disables TLS certificate
                              verification.
                            type: boolean
                          key:
                            type: string
                          region:
                            description: Region for AWS S3; optional for MinIO/Ceph.
                            type: string
                          sha256:
                            description: SHA256 of the decompressed qcow2. Optional
                              but recommended.
                            type: string
                          usePathStyle:
                            description: UsePathStyle forces path-style addressing.
                            type: boolean
                        required:
                        - bucket
                        - endpoint
                        - key
                        type: object
                      type:
                        description: BootArtifactsSourceType enumerates supported
                          artifact transports.
                        enum:
                        - HTTPS
                        - OCI
                        - S3
                        type: string
                    required:
                    - type
                    type: object
                  volumeName:
                    description: |-
                      VolumeName is the libvirt volume name the staged image will register as
                      inside Pool. Use the same value in LibvirtMachine.spec.rootDisk.baseImage.
                    minLength: 1
                    pattern: ^[A-Za-z0-9_.:-]+$
                    type: string
                required:
                - pool
                - source
                - volumeName
                type: object
              bootArtifacts:
                description: |-
                  bootArtifacts, when set, switches first-boot ignition delivery from
                  QEMU fw_cfg to libvirt direct-kernel-boot plus a virtio-blk ignition
                  disk. The kernel's qemu_fw_cfg driver does O(n²) offset reads, which
                  burns seconds of wall-clock time for multi-MB ignition payloads.
                properties:
                  hostPath:
                    description: |-
                      HostPath is the directory on each libvirt host where kernel/initramfs are cached.
                      Files land at <HostPath>/<sha256>/vmlinuz and <HostPath>/<sha256>/initramfs.img.
                    pattern: ^/[A-Za-z0-9._/-]+$
                    type: string
                  kernelArgs:
                    description: |-
                      KernelArgs is the cmdline appended to the direct-boot kernel. The user is
                      responsible for setting an ignition.config.url that reads from the virtio-blk
                      ignition disk (serial=ignition), e.g.
                        "ignition.platform.id=metal ignition.config.url=oem:/dev/disk/by-id/virtio-ignition console=ttyS0"
                    minLength: 1
                    type: string
                  source:
                    description: Source describes where to fetch the kernel and initramfs
                      from.
                    properties:
                      https:
                        description: HTTPSBootArtifactsSource fetches kernel+initramfs
                          over HTTPS.
                        properties:
                          initramfsSHA256:
                            type: string
                          initramfsURL:
                            type: string
                          kernelSHA256:
                            type: string
                          kernelURL:
                            type: string
                        required:
                        - initramfsURL
                        - kernelURL
                        type: object
                      oci:
                        description: |-
                          OCIBootArtifactsSource fetches kernel+initramfs from a single OCI artifact.
                          The artifact is expected to be an `oras push`-style manifest whose layers
                          each carry an `org.opencontainers.image.title` annotation matching the file
                          name. KernelLayerTitle and InitramfsLayerTitle select the two layers; the
                          resolver fetches only those two blobs.
                        properties:
                          credentialsSecretRef:
                            description: |-
                              CredentialsSecretRef references a Secret in the LibvirtCluster's
                              namespace containing registry credentials.
                              The Secret is read in two formats, in order of preference:
                                1. `.dockerconfigjson` (a kubernetes.io/dockerconfigjson Secret).
                                2. plain `username` / `password` keys.
                            properties:
                              name:
                                description: Name of the Secret.
                                minLength: 1
                                type: string
                              namespace:
                                description: |-
                                  Namespace of the Secret. Deprecated: the Secret must live in the
                                  LibvirtCluster's own namespace, so the only accepted values are "" and
                                  that namespace. Naming any other namespace is rejected — the controller
                                  reads Secrets with cluster-wide RBAC and this spec also chooses the
                                  endpoint the credential is sent to, so an unconfined reference here is a
                                  credential-exfiltration primitive.
                                type: string
                            required:
                            - name
                            type: object
                          initramfsLayerTitle:
                            description: |-
                              InitramfsLayerTitle is the org.opencontainers.image.title annotation
                              that identifies the initramfs layer. Defaults to "initramfs.img".
                            type: string
                          initramfsSHA256:
                            type: string
                          insecureSkipTLSVerify:
                            description: |-
                              InsecureSkipTLSVerify disables TLS certificate verification on the
                              registry endpoint. Intended only for self-signed dev registries.
                            type: boolean
                          kernelLayerTitle:
                            description: |-
                              KernelLayerTitle is the org.opencontainers.image.title annotation that
                              identifies the kernel layer in the manifest. Defaults to "vmlinuz".
                            type: string
                          kernelSHA256:
                            type: string
                          plainHTTP:
                            description: |-
                              PlainHTTP allows non-TLS pulls from the registry. Intended only for
                              in-cluster mirrors and development. Defaults to false.
                            type: boolean
                          reference:
                            description: Reference is the full OCI reference, e.g.
                              "ghcr.io/example/boot:v1".
                            type: string
                        required:
                        - reference
                        type: object
                      s3:
                        description: S3BootArtifactsSource fetches kernel+initramfs
                          from an S3-compatible store.
                        properties:
                          bucket:
                            type: string
                          credentialsSecretRef:
                            description: |-
                              CredentialsSecretRef references a Secret in the LibvirtCluster's
                              namespace containing static credentials.
                              Recognized keys: `accessKeyID`, `secretAccessKey`, optional
                              `sessionToken`. If unset, the resolver attempts anonymous reads.
                            properties:
                              name:
                                description: Name of the Secret.
                                minLength: 1
                                type: string
                              namespace:
                                description: |-
                                  Namespace of the Secret. Deprecated: the Secret must live in the
                                  LibvirtCluster's own namespace, so the only accepted values are "" and
                                  that namespace. Naming any other namespace is rejected — the controller
                                  reads Secrets with cluster-wide RBAC and this spec also chooses the
                                  endpoint the credential is sent to, so an unconfined reference here is a
                                  credential-exfiltration primitive.
                                type: string
                            required:
                            - name
                            type: object
                          endpoint:
                            description: |-
                              Endpoint is the S3 endpoint host[:port], e.g. "s3.amazonaws.com" or
                              "minio.svc.cluster.local:9000".
                            type: string
                          initramfsKey:
                            type: string
                          initramfsSHA256:
                            type: string
                          insecure:
                            description: Insecure switches the endpoint to plain HTTP.
                              Defaults to false.
                            type: boolean
                          insecureSkipTLSVerify:
                            description: InsecureSkipTLSVerify disables TLS certificate
                              verification.
                            type: boolean
                          kernelKey:
                            type: string
                          kernelSHA256:
                            type: string
                          region:
                            description: |-
                              Region is the bucket's region. Optional for MinIO/Ceph; required by
                              AWS S3 (defaults to "us-east-1" if empty).
                            type: string
                          usePathStyle:
                            description: |-
                              UsePathStyle forces path-style addressing (bucket as URL path) rather
                              than virtual-hosted style. Required by MinIO and some Ceph setups.
                            type: boolean
                        required:
                        - bucket
                        - endpoint
                        - initramfsKey
                        - kernelKey
                        type: object
                      type:
                        description: BootArtifactsSourceType enumerates supported
                          artifact transports.
                        enum:
                        - HTTPS
                        - OCI
                        - S3
                        type: string
                    required:
                    - type
                    type: object
                required:
                - hostPath
                - kernelArgs
                - source
                type: object
              controlPlaneEndpoint:
                description: |-
                  controlPlaneEndpoint represents the endpoint used to communicate with the
                  control plane.

                  Optional, because an unset endpoint is a legitimate state rather than an
                  invalid object: the cluster simply reports Ready=false with reason
                  WaitingForControlPlaneEndpoint until a host and a valid port appear. It
                  also has to be omittable for LibvirtClusterTemplate, where baking one
                  endpoint into a template would stamp the same address onto every cluster
                  created from it.
                properties:
                  host:
                    description: host is the hostname on which the API server is serving.
                    type: string
                  port:
                    description: port is the port on which the API server is serving.
                    format: int32
                    type: integer
                required:
                - host
                - port
                type: object
            type: object
          status:
            description: status defines the observed state of LibvirtCluster.
            properties:
              conditions:
                description: conditions represent the current state of the LibvirtCluster
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              failureDomains:
                description: |-
                  failureDomains lists the failure domains available to machines of this
                  cluster, in the list shape of the Cluster API v1beta2 InfraCluster
                  contract. Each LibvirtHost in the cluster's namespace is its own failure
                  domain, named after the host: a host is an independent hypervisor whose
                  loss takes down only the VMs it runs.
                items:
                  description: |-
                    FailureDomain describes one failure domain, matching the Cluster API v1beta2
                    FailureDomain type.
                  properties:
                    attributes:
                      additionalProperties:
                        type: string
                      description: |-
                        attributes is a free form map of attributes an infrastructure provider
                        might use or require.
                      type: object
                    controlPlane:
                      description: |-
                        controlPlane determines if this failure domain is suitable for use by
                        control plane machines.
                      type: boolean
                    name:
                      description: 'name is the name of the failure domain: the name
                        of a LibvirtHost.'
                      maxLength: 256
                      minLength: 1
                      type: string
                  required:
                  - name
                  type: object
                maxItems: 10000
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              initialization:
                description: |-
                  initialization reports one-time provisioning milestones, as defined by
                  the Cluster API v1beta2 InfraCluster contract. Cluster API releases that
                  use the v1beta2 contract read initialization.provisioned instead of
                  ready; both are set.
                minProperties: 1
                properties:
                  provisioned:
                    description: |-
                      provisioned is true once the cluster infrastructure is ready for the
                      control plane. Once true it is never set back to false.
                    type: boolean
                type: object
              ready:
                description: ready indicates whether the cluster infrastructure is
                  ready.
                type: boolean
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
