---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: libvirtmachines.infrastructure.cluster.x-k8s.io
spec:
  group: infrastructure.cluster.x-k8s.io
  names:
    categories:
    - cluster-api
    kind: LibvirtMachine
    listKind: LibvirtMachineList
    plural: libvirtmachines
    shortNames:
    - libvirtm
    singular: libvirtmachine
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.hostRef.name
      name: Host
      type: string
    - jsonPath: .status.ready
      name: Ready
      type: boolean
    - jsonPath: .status.domainState
      name: State
      type: string
    - jsonPath: .spec.providerID
      name: ProviderID
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          LibvirtMachine is the Schema for the libvirtmachines API.
          It represents a virtual machine managed by libvirt as a Cluster API infrastructure machine.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of LibvirtMachine.
            properties:
              additionalDisks:
                description: additionalDisks is an optional list of additional data
                  disks to attach.
                items:
                  description: AdditionalDiskSpec defines an additional data disk.
                  properties:
                    bus:
                      default: virtio
                      description: bus is the disk bus type.
                      type: string
                    name:
                      description: name is a unique identifier for this disk within
                        the machine.
                      minLength: 1
                      pattern: ^[A-Za-z0-9_.:-]+$
                      type: string
                    size:
                      anyOf:
                      - type: integer
                      - type: string
                      description: size is the desired size of the disk.
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    storagePool:
                      description: storagePool is the name of the libvirt storage
                        pool to use.
                      minLength: 1
                      pattern: ^[A-Za-z0-9_.:-]+$
                      type: string
                  required:
                  - name
                  - size
                  - storagePool
                  type: object
                type: array
              bootstrapFormat:
                default: ignition
                description: bootstrapFormat specifies the format of bootstrap data
                  to generate.
                enum:
                - ignition
                - cloud-init
                type: string
              domain:
                description: domain defines the virtual machine domain configuration.
                properties:
                  firmware:
                    default: uefi
                    description: firmware is the firmware type for the virtual machine.
                    enum:
                    - uefi
                    - bios
                    type: string
                  machine:
                    default: q35
                    description: machine is the QEMU machine type.
                    type: string
                  memoryMB:
                    description: |-
                      memoryMB is the amount of memory in megabytes to allocate.
                      If zero or omitted, auto-sized from the LibvirtHost's available
                      capacity (total memory minus reserved).
                    format: int32
                    minimum: 0
                    type: integer
                  vcpus:
                    description: |-
                      vcpus is the number of virtual CPUs to allocate.
                      If zero or omitted, auto-sized from the LibvirtHost's available
                      capacity (total vCPUs minus reserved).
                    format: int32
                    minimum: 0
                    type: integer
                type: object
              hostRef:
                description: hostRef is a reference to a LibvirtHost resource in the
                  same namespace.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              network:
                description: network defines the network configuration for the virtual
                  machine.
                properties:
                  addresses:
                    description: addresses is a list of static IP addresses in CIDR
                      notation (e.g. 192.168.1.10/24).
                    items:
                      type: string
                    minItems: 1
                    type: array
                  dns:
                    description: dns defines DNS configuration for the network.
                    properties:
                      nameservers:
                        description: nameservers is a list of DNS server addresses.
                        items:
                          type: string
                        type: array
                      searchDomains:
                        description: searchDomains is a list of DNS search domains.
                        items:
                          type: string
                        type: array
                    type: object
                  gateway:
                    description: gateway is the default gateway address.
                    type: string
                  macAddress:
                    description: |-
                      macAddress is an optional MAC address to assign to the interface. When
                      unset, CAPLV derives a stable one from the domain name in QEMU's
                      52:54:00 range, which cloud-init guests use to match the NIC to the
                      static address configuration CAPLV gives them.
                    type: string
                  model:
                    default: virtio
                    description: model is the NIC model.
                    type: string
                  name:
                    description: name is the name of the libvirt network or bridge
                      device.
                    minLength: 1
                    type: string
                  type:
                    description: type is the type of libvirt network attachment.
                    enum:
                    - bridge
                    - network
                    type: string
                required:
                - addresses
                - name
                - type
                type: object
              nodeAnnotations:
                additionalProperties:
                  type: string
                description: |-
                  nodeAnnotations are annotations to apply to the Kubernetes Node once
                  kubelet registers it with the cluster. Same ownership and removal
                  semantics as nodeLabels.
                type: object
              nodeLabels:
                additionalProperties:
                  type: string
                description: |-
                  nodeLabels are labels to apply to the Kubernetes Node once kubelet
                  registers it with the cluster. Unlike CAPI's Machine.spec.nodeLabels
                  (which enforces a prefix allow-list to avoid bypassing NodeRestriction),
                  CAPLV patches the Node directly from the controller's own identity, so
                  arbitrary keys (e.g. "dynatrace", "aqua", "k8s.ovn.org/egress-assignable")
                  are accepted. Keys removed from this map on a later update are removed
                  from the Node; admin-applied labels that CAPLV never set are left
                  untouched.
                type: object
              providerID:
                description: |-
                  providerID is the identifier used by CAPI to reference this machine.
                  Set by the controller after the domain is created.
                type: string
              rootDisk:
                description: rootDisk defines the root disk configuration.
                properties:
                  baseImage:
                    description: baseImage is the name of the base image volume to
                      clone from.
                    minLength: 1
                    pattern: ^[A-Za-z0-9_.:-]+$
                    type: string
                  baseImagePool:
                    description: |-
                      baseImagePool is the storage pool containing the base image.
                      If unset, defaults to storagePool. This allows the base image to
                      live on persistent storage while ephemeral VM disks use a different
                      pool (e.g., tmpfs-backed for ephemeral workers).
                    pattern: ^[A-Za-z0-9_.:-]+$
                    type: string
                  bus:
                    default: virtio
                    description: bus is the disk bus type.
                    type: string
                  cloneStrategy:
                    default: copy-on-write
                    description: cloneStrategy defines how the root disk is cloned
                      from the base image.
                    enum:
                    - copy-on-write
                    - full-clone
                    type: string
                  ephemeralPool:
                    description: |-
                      ephemeralPool, when true, causes CAPLV to create a per-machine
                      tmpfs-backed pool named <namespace>-<cluster>-<machine>-pool
                      (surfaced in status.artifacts.ephemeralPoolName) at provisioning
                      time and destroy it, including the tmpfs mount, at deletion time.
                      The root disk and any bootstrap ISO are placed in this generated
                      pool instead of storagePool. This ensures the host's persistent
                      storage is never touched and RAM is only consumed while the VM
                      exists. Set baseImagePool to the persistent pool holding the base
                      image.
                    type: boolean
                  ephemeralPoolSize:
                    description: |-
                      ephemeralPoolSize caps the RAM the ephemeral tmpfs mount may consume.
                      Accepts tmpfs `size=` syntax: a percentage of physical RAM (e.g. "80%")
                      or an absolute size (e.g. "16G"). When unset, the kernel default (50%
                      of physical RAM) applies. Only meaningful when ephemeralPool is true.
                    pattern: ^([1-9][0-9]?|100)%$|^[1-9][0-9]*[KMGTkmgt]?$
                    type: string
                  size:
                    anyOf:
                    - type: integer
                    - type: string
                    description: size is the desired size of the root disk.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  storagePool:
                    description: |-
                      storagePool is the name of the pre-existing libvirt storage pool
                      that receives the root disk volume (and the NoCloud ISO for
                      cloud-init guests). Not used as the disk target when ephemeralPool
                      is true — CAPLV then provisions its own per-machine tmpfs pool
                      instead — though baseImagePool still defaults to this value when
                      unset.
                    minLength: 1
                    pattern: ^[A-Za-z0-9_.:-]+$
                    type: string
                required:
                - baseImage
                - size
                - storagePool
                type: object
            required:
            - bootstrapFormat
            - domain
            - hostRef
            - network
            - rootDisk
            type: object
          status:
            description: status defines the observed state of LibvirtMachine.
            properties:
              addresses:
                description: addresses is the list of addresses assigned to the machine.
                items:
                  description: MachineAddress contains information for the node's
                    address.
                  properties:
                    address:
                      description: address is the machine address.
                      type: string
                    type:
                      description: type is the machine address type, one of Hostname,
                        ExternalIP, InternalIP, ExternalDNS or InternalDNS.
                      type: string
                  required:
                  - address
                  - type
                  type: object
                type: array
              conditions:
                description: conditions represent the current state of the LibvirtMachine
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              domainState:
                description: domainState is the current state of the libvirt domain
                  (e.g. running, shutoff).
                type: string
              domainUUID:
                description: domainUUID is the UUID of the libvirt domain.
                type: string
              failureDomain:
                description: |-
                  failureDomain is the failure domain the machine runs in, as defined by
                  the Cluster API v1beta2 InfraMachine contract. Failure domains are
                  LibvirtHosts, so this is always spec.hostRef.name.
                maxLength: 256
                minLength: 1
                type: string
              failureMessage:
                description: failureMessage is a human-readable description of the
                  failure.
                type: string
              failureReason:
                description: failureReason is a machine-readable string indicating
                  the reason for a failure.
                type: string
              initialization:
                description: |-
                  initialization reports one-time provisioning milestones, as defined by
                  the Cluster API v1beta2 InfraMachine contract. Cluster API releases that
                  use the v1beta2 contract read initialization.provisioned instead of
                  ready; both are set.
                minProperties: 1
                properties:
                  provisioned:
                    description: |-
                      provisioned is true once the domain has been created and started.
                      Once true it is never set back to false.
                    type: boolean
                type: object
              managedArtifacts:
                description: managedArtifacts tracks the libvirt artifacts managed
                  by the controller.
                properties:
                  additionalDiskVolumes:
                    description: additionalDiskVolumes is a list of additional disk
                      volume names.
                    items:
                      type: string
                    type: array
                  bootstrapISO:
                    description: |-
                      bootstrapISO is the name of the bootstrap ISO volume in the storage pool.
                      Only used for cloud-init bootstrap format.
                    type: string
                  domainName:
                    description: domainName is the name of the libvirt domain.
                    type: string
                  ephemeralPoolName:
                    description: |-
                      ephemeralPoolName is the name of the tmpfs pool created by CAPLV.
                      Only set when spec.rootDisk.ephemeralPool is true.
                    type: string
                  ignitionFile:
                    description: |-
                      ignitionFile is the path to the ignition JSON file on the host.
                      Only used for ignition bootstrap format (delivered via fw_cfg).
                    type: string
                  nvramPath:
                    description: |-
                      nvramPath is the path to the NVRAM file on the host. Empty on
                      session-mode hosts, where libvirt places the NVRAM file in the
                      per-user daemon's own nvram directory.
                    type: string
                  rootDiskVolume:
                    description: rootDiskVolume is the name of the root disk volume
                      in the storage pool.
                    type: string
                type: object
              ready:
                description: ready indicates whether the machine infrastructure is
                  ready.
                type: boolean
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
