# CAPLV "topology" flavor — `clusterctl generate cluster --flavor topology`.
#
# A ClusterClass-based cluster: the Cluster below names the
# "libvirt-kubeadm" ClusterClass, which clusterctl fetches from
# clusterclass-libvirt-kubeadm.yaml and includes in the output when the
# target namespace does not already have it. Read that file's header first;
# in short:
#
#   - ClusterClass requires a control plane provider and bootstrap templates,
#     so unlike the default flavor this one builds a NEW workload cluster with
#     the core CAPI kubeadm providers (KubeadmControlPlane + KubeadmConfig)
#     on cloud-init guests. Install them with
#     `clusterctl init --infrastructure libvirt --control-plane kubeadm
#     --bootstrap kubeadm` (the defaults) and enable the ClusterTopology
#     feature gate (CLUSTER_TOPOLOGY=true) if your CAPI version still gates it.
#   - Machines claim LibvirtHosts by label, so register the hosts first, in
#     the cluster's namespace: label control plane hosts
#     caplv.infrastructure.cluster.x-k8s.io/role=control-plane and worker
#     hosts caplv.infrastructure.cluster.x-k8s.io/role=worker, and give each
#     a spec.machineNetwork with its VM's address. See "Choosing hosts" in
#     docs/configuration.md. A host runs one VM, so WORKER_MACHINE_COUNT can
#     be at most the number of worker hosts.
#   - BASE_IMAGE must be a cloud-init qcow2 with kubeadm/kubelet/containerd
#     matching KUBERNETES_VERSION (e.g. an image-builder qemu EFI build),
#     staged in STORAGE_POOL on every host.
#
# The control plane endpoint has no load balancer in front of it: with one
# control plane machine, CONTROL_PLANE_ENDPOINT_HOST is the address in the
# control plane host's spec.machineNetwork, without its prefix length.
#
# Variables (set via clusterctl --config or env):
#   CLUSTER_NAME, NAMESPACE, KUBERNETES_VERSION
#   CONTROL_PLANE_ENDPOINT_HOST   (CONTROL_PLANE_ENDPOINT_PORT defaults to 6443)
#   BASE_IMAGE                    (cloud-init qcow2 in STORAGE_POOL)
#
# Optional (have defaults):
#   WORKER_MACHINE_COUNT          (default 1; clusterctl --worker-machine-count)
#   SERVICE_CIDR, POD_CIDR, SERVICE_DOMAIN
#   STORAGE_POOL, ROOT_DISK_SIZE
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: ${CLUSTER_NAME}
  namespace: ${NAMESPACE}
spec:
  clusterNetwork:
    services:
      cidrBlocks: ${SERVICE_CIDR:=["10.96.0.0/12"]}
    pods:
      cidrBlocks: ${POD_CIDR:=["192.168.0.0/18"]}
    serviceDomain: ${SERVICE_DOMAIN:="cluster.local"}
  topology:
    classRef:
      name: libvirt-kubeadm
    version: ${KUBERNETES_VERSION}
    controlPlane:
      # The endpoint is one host's address; see the ClusterClass header.
      replicas: 1
    workers:
      machineDeployments:
        - class: default-worker
          name: md-0
          replicas: ${WORKER_MACHINE_COUNT:=1}
    variables:
      - name: controlPlaneEndpoint
        value:
          host: ${CONTROL_PLANE_ENDPOINT_HOST}
          port: ${CONTROL_PLANE_ENDPOINT_PORT:=6443}
      - name: rootDisk
        value:
          baseImage: ${BASE_IMAGE}
          storagePool: ${STORAGE_POOL:=default}
          size: ${ROOT_DISK_SIZE:=50Gi}
