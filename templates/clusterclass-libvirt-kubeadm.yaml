# CAPLV ClusterClass "libvirt-kubeadm" — used by the "topology" flavor
# (templates/cluster-template-topology.yaml). clusterctl fetches this file
# automatically when a generated Cluster's spec.topology.classRef.name is
# libvirt-kubeadm and no ClusterClass of that name exists in the target
# namespace yet; it can also be applied on its own.
#
# This file deliberately contains no clusterctl variables: one
# ClusterClass serves many clusters, so everything per-cluster arrives as a
# ClusterClass variable set in Cluster.spec.topology.variables and is patched
# into the per-cluster copies of the templates below.
#
# Why kubeadm, unlike the default template: CAPI requires every ClusterClass
# to name a control plane provider template (spec.controlPlane.templateRef)
# and, for every worker class, a bootstrap config template. The default
# template's model — a pre-existing control plane plus hand-made bootstrap
# Secrets, or capi-bootstrap-ignition's IgnitionConfig, which has no
# template kind — cannot be expressed as a ClusterClass. This class
# therefore uses the core CAPI kubeadm providers (KubeadmControlPlane +
# KubeadmConfig) and builds a new workload cluster with cloud-init guests.
#
# Placement (see docs/adr/0006-host-and-address-allocation.md):
#   - Machines are placed by host selector. Each control plane machine claims
#     a free LibvirtHost matching controlPlaneHostSelector, and each worker one
#     matching workerHostSelector; by default, hosts labelled
#     caplv.infrastructure.cluster.x-k8s.io/role=control-plane and =worker.
#     A host runs one VM, so a role scales to as many machines as it has
#     matching hosts.
#   - Each VM takes its network (bridge or libvirt network, address, gateway,
#     DNS) from its host's spec.machineNetwork, so register the hosts with
#     one before creating a cluster.
#   - The control plane endpoint is fixed when the cluster is created. With
#     one control plane machine and no load balancer it is the address of
#     the one control plane host. A KubeadmControlPlane rollout (e.g. a
#     Kubernetes upgrade) surges onto another host with another address, so
#     without a load balancer or virtual IP in front of the control plane,
#     recreate the cluster rather than rolling the control plane.
#   - Workers roll out delete-first (maxSurge 0), which never needs a spare
#     host.
#
# Guest requirements: a cloud-init enabled qcow2 with kubeadm, kubelet and a
# container runtime pre-installed (for example an image-builder "qemu"
# build, using its EFI variant since machines default to UEFI firmware).
# CAPLV writes each machine's static address into the NoCloud
# network-config, which cloud-init applies with the guest's own network
# stack, so Ubuntu (netplan) and Enterprise Linux (NetworkManager) guests
# both work; the e2e suite tests Ubuntu 24.04 and CentOS Stream 9. The
# kubelet's --provider-id is read from the provider_id CAPLV writes into the
# NoCloud meta-data, since it names the host CAPLV chose. The node is named
# after cloud-init's local hostname: the domain name, or a hashed
# 63-character form of it when longer, since Node names can be no longer.
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: ClusterClass
metadata:
  name: libvirt-kubeadm
spec:
  infrastructure:
    templateRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
      kind: LibvirtClusterTemplate
      name: libvirt-kubeadm-cluster
  controlPlane:
    templateRef:
      apiVersion: controlplane.cluster.x-k8s.io/v1beta2
      kind: KubeadmControlPlaneTemplate
      name: libvirt-kubeadm-control-plane
    machineInfrastructure:
      templateRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
        kind: LibvirtMachineTemplate
        name: libvirt-kubeadm-control-plane
  workers:
    machineDeployments:
      - class: default-worker
        bootstrap:
          templateRef:
            apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
            kind: KubeadmConfigTemplate
            name: libvirt-kubeadm-default-worker
        infrastructure:
          templateRef:
            apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
            kind: LibvirtMachineTemplate
            name: libvirt-kubeadm-default-worker
        rollout:
          strategy:
            type: RollingUpdate
            rollingUpdate:
              maxSurge: 0
              maxUnavailable: 1
  variables:
    - name: controlPlaneEndpoint
      required: true
      schema:
        openAPIV3Schema:
          type: object
          description: >-
            API server endpoint of the workload cluster. With a single
            control plane machine and no load balancer this is the address in
            the control plane host's spec.machineNetwork (without the prefix
            length).
          required: [host]
          properties:
            host:
              type: string
              minLength: 1
            port:
              type: integer
              default: 6443
              minimum: 1
              maximum: 65535
    - name: controlPlaneHostSelector
      required: false
      schema:
        openAPIV3Schema:
          type: object
          description: Labels the LibvirtHosts for control plane machines must have.
          default:
            matchLabels:
              caplv.infrastructure.cluster.x-k8s.io/role: control-plane
          properties:
            matchLabels:
              type: object
              additionalProperties:
                type: string
    - name: workerHostSelector
      required: false
      schema:
        openAPIV3Schema:
          type: object
          description: Labels the LibvirtHosts for default-worker machines must have.
          default:
            matchLabels:
              caplv.infrastructure.cluster.x-k8s.io/role: worker
          properties:
            matchLabels:
              type: object
              additionalProperties:
                type: string
    - name: rootDisk
      required: true
      schema:
        openAPIV3Schema:
          type: object
          description: Root disk shared by all machines.
          required: [baseImage]
          properties:
            baseImage:
              type: string
              description: Base qcow2 volume name in storagePool.
              minLength: 1
            storagePool:
              type: string
              default: default
              minLength: 1
            size:
              type: string
              default: 50Gi
  patches:
    - name: controlPlaneEndpoint
      description: Sets the per-cluster API endpoint on the LibvirtCluster.
      definitions:
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
            kind: LibvirtClusterTemplate
            matchResources:
              infrastructureCluster: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/controlPlaneEndpoint
              valueFrom:
                template: |
                  host: '{{ .controlPlaneEndpoint.host }}'
                  port: {{ .controlPlaneEndpoint.port }}
    - name: rootDisk
      description: Root disk shared by every LibvirtMachine.
      definitions:
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
            kind: LibvirtMachineTemplate
            matchResources:
              controlPlane: true
              machineDeploymentClass:
                names: [default-worker]
          jsonPatches:
            - op: replace
              path: /spec/template/spec/rootDisk/baseImage
              valueFrom:
                variable: rootDisk.baseImage
            - op: replace
              path: /spec/template/spec/rootDisk/storagePool
              valueFrom:
                variable: rootDisk.storagePool
            - op: replace
              path: /spec/template/spec/rootDisk/size
              valueFrom:
                variable: rootDisk.size
    - name: controlPlaneHostSelector
      description: Which hosts control plane machines claim.
      definitions:
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
            kind: LibvirtMachineTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: replace
              path: /spec/template/spec/hostSelector
              valueFrom:
                variable: controlPlaneHostSelector
    - name: workerHostSelector
      description: Which hosts default-worker machines claim.
      definitions:
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
            kind: LibvirtMachineTemplate
            matchResources:
              machineDeploymentClass:
                names: [default-worker]
          jsonPatches:
            - op: replace
              path: /spec/template/spec/hostSelector
              valueFrom:
                variable: workerHostSelector
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: LibvirtClusterTemplate
metadata:
  name: libvirt-kubeadm-cluster
spec:
  template:
    # controlPlaneEndpoint is left unset on purpose; the controlPlaneEndpoint
    # patch sets it per cluster.
    spec: {}
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: KubeadmControlPlaneTemplate
metadata:
  name: libvirt-kubeadm-control-plane
spec:
  template:
    spec:
      kubeadmConfigSpec:
        format: cloud-config
        # Both values are rendered by cloud-init (jinja) from the NoCloud
        # meta-data CAPLV writes: local-hostname is the domain name (or a
        # shortened form when it is longer than 63 characters), and
        # provider_id is the providerID CAPLV reports for the machine.
        initConfiguration:
          nodeRegistration:
            name: '{{ v1.local_hostname }}'
            kubeletExtraArgs:
              - name: provider-id
                value: '{{ ds.meta_data.provider_id }}'
        joinConfiguration:
          nodeRegistration:
            name: '{{ v1.local_hostname }}'
            kubeletExtraArgs:
              - name: provider-id
                value: '{{ ds.meta_data.provider_id }}'
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: LibvirtMachineTemplate
metadata:
  name: libvirt-kubeadm-control-plane
spec:
  template:
    spec:
      # hostSelector and rootDisk below are placeholders required by the
      # schema; the ClusterClass patches replace them per cluster. The
      # network is left to each host's spec.machineNetwork.
      hostSelector: {}
      # Empty domain: vCPUs and memory are auto-sized from the host's
      # capacity minus its reserved resources.
      domain: {}
      rootDisk:
        baseImage: placeholder-set-by-clusterclass
        storagePool: default
        size: 50Gi
      bootstrapFormat: cloud-init
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KubeadmConfigTemplate
metadata:
  name: libvirt-kubeadm-default-worker
spec:
  template:
    spec:
      format: cloud-config
      joinConfiguration:
        nodeRegistration:
          name: '{{ v1.local_hostname }}'
          kubeletExtraArgs:
            - name: provider-id
              value: '{{ ds.meta_data.provider_id }}'
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: LibvirtMachineTemplate
metadata:
  name: libvirt-kubeadm-default-worker
spec:
  template:
    spec:
      hostSelector: {}
      domain: {}
      rootDisk:
        baseImage: placeholder-set-by-clusterclass
        storagePool: default
        size: 50Gi
      bootstrapFormat: cloud-init
