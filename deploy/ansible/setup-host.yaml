---
# CAPLV Host Setup Playbook
#
# Fully prepares a RHEL/Fedora host to be managed by CAPLV. Run with:
#
#   ansible-playbook -i <host>, -u root deploy/ansible/setup-host.yaml
#
# Optional variables (--extra-vars):
#   stage_base_image  - set to "true" to download a qcow2 base image at host
#                       setup time. Default false. Most clusters now use
#                       LibvirtCluster.spec.baseImage instead, which lets the
#                       controller distribute the qcow2 on demand and removes
#                       the version-mismatch risk between hosts.
#   base_image_url    - URL to download (only consulted when stage_base_image=true)
#   base_image_name   - filename in the storage pool (default: rhcos.qcow2)
#   caplv_user        - service account name (default: caplv)
#   libvirt_mode      - "system" (default) or "session". In session mode the
#                       VMs run under the service account's per-user libvirt
#                       daemon instead of the root-managed system daemon.
#                       Session mode only supports network.type=bridge on
#                       machines; bridges must be listed in
#                       session_allowed_bridges so qemu-bridge-helper can
#                       attach taps to them.
#   session_allowed_bridges - bridges whitelisted for qemu-bridge-helper in
#                       session mode (default: [virbr0])
#   storage_pool_path - libvirt default pool path (default:
#                       /var/lib/libvirt/images in system mode,
#                       ~caplv/.local/share/libvirt/images in session mode)
#   ssh_key_path      - where to write the generated key pair (default: /tmp/caplv-key)

- name: Prepare host for CAPLV
  hosts: all
  become: true
  gather_facts: false

  vars:
    caplv_user: caplv
    libvirt_mode: system
    session_allowed_bridges: [virbr0]
    bridge_helper_path: /usr/libexec/qemu-bridge-helper
    storage_pool_path: "{{ '/home/' + caplv_user + '/.local/share/libvirt/images' if libvirt_mode == 'session' else '/var/lib/libvirt/images' }}"
    stage_base_image: false
    base_image_url: https://mirror.openshift.com/pub/openshift-v4/dependencies/rhcos/4.18/latest/rhcos-qemu.x86_64.qcow2.gz
    base_image_name: rhcos.qcow2
    ssh_key_path: /tmp/caplv-key

  tasks:
    - name: Validate libvirt_mode
      ansible.builtin.assert:
        that: libvirt_mode in ['system', 'session']
        fail_msg: "libvirt_mode must be 'system' or 'session', got '{{ libvirt_mode }}'"

    # ── Packages (use shell to avoid python module issues) ────

    - name: Install libvirt and UEFI firmware
      ansible.builtin.raw: >
        yum install -y libvirt libvirt-daemon-kvm qemu-kvm edk2-ovmf openssh-server ||
        dnf install -y libvirt libvirt-daemon-kvm qemu-kvm edk2-ovmf openssh-server
      changed_when: true

    - name: Start and enable libvirtd
      ansible.builtin.raw: systemctl enable --now libvirtd
      changed_when: true

    - name: Start and enable sshd
      ansible.builtin.raw: systemctl enable --now sshd
      changed_when: true

    # Now that packages are installed, gather facts
    - name: Gather facts
      ansible.builtin.setup:

    # ── SSH key pair ──────────────────────────────────────────

    # One key pair serves every host in the play. The local tasks run once,
    # not once per host, or parallel runs race to create the same file.
    - name: Generate SSH key pair
      ansible.builtin.command:
        cmd: ssh-keygen -t ed25519 -f {{ ssh_key_path }} -N "" -C "caplv-service-account"
        creates: "{{ ssh_key_path }}"
      delegate_to: localhost
      become: false
      run_once: true

    - name: Read public key
      ansible.builtin.slurp:
        src: "{{ ssh_key_path }}.pub"
      register: ssh_pub_key
      delegate_to: localhost
      become: false
      run_once: true

    # ── Service account ───────────────────────────────────────

    - name: Create caplv service account
      ansible.builtin.user:
        name: "{{ caplv_user }}"
        system: true
        shell: /bin/bash
        # Session mode needs direct /dev/kvm access (the kvm group); in system
        # mode QEMU runs as the qemu user and the libvirt group suffices.
        groups: "{{ 'libvirt,kvm' if libvirt_mode == 'session' else 'libvirt' }}"
        append: true
        create_home: true

    - name: Get service account uid
      ansible.builtin.command: id -u {{ caplv_user }}
      register: caplv_uid
      changed_when: false

    - name: Create .ssh directory
      ansible.builtin.file:
        path: "/home/{{ caplv_user }}/.ssh"
        state: directory
        owner: "{{ caplv_user }}"
        group: "{{ caplv_user }}"
        mode: "0700"

    - name: Deploy SSH authorized key
      ansible.builtin.copy:
        content: "{{ ssh_pub_key.content | b64decode }}"
        dest: "/home/{{ caplv_user }}/.ssh/authorized_keys"
        owner: "{{ caplv_user }}"
        group: "{{ caplv_user }}"
        mode: "0600"

    # ── Privileged helper + sudoers ───────────────────────────
    #
    # The service account gets sudo for exactly one command, which validates its
    # own arguments. Wildcards cannot be used safely here: in a sudoers *command
    # argument* (unlike the command path) a '*' matches '/' too, so a rule such
    # as "/usr/bin/tee /run/caplv/*" also permits
    # "/usr/bin/tee /run/caplv/../../etc/sudoers.d/x" — sudo matches the literal
    # argv and never canonicalises it. That made the previous "restricted" rule
    # set equivalent to full root. caplv-hostctl resolves every path with
    # `realpath -m` (which collapses '..' and follows symlinks) and refuses
    # anything that does not land under /run/caplv.

    - name: Install the CAPLV privileged helper
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          # caplv-hostctl — the only command the CAPLV service account may run as
          # root. Managed by deploy/ansible/setup-host.yaml; do not edit in place.
          set -euo pipefail

          readonly BASE=/run/caplv
          readonly LIBVIRT_MODE={{ libvirt_mode | quote }}
          readonly CAPLV_USER={{ caplv_user | quote }}

          # Artifact ownership. The ignition config staged here is the cluster's
          # worker bootstrap payload, so it must not be world-readable: only the
          # process that consumes it needs access. In system mode that is qemu;
          # in session mode the per-user daemon runs as the service account.
          if [[ $LIBVIRT_MODE == session ]]; then
            readonly OWNER="$CAPLV_USER" GROUP="$CAPLV_USER" DIR_MODE=0700 FILE_MODE=0600
          else
            readonly OWNER=root GROUP=qemu DIR_MODE=0750 FILE_MODE=0640
          fi

          die() { printf 'caplv-hostctl: %s\n' "$*" >&2; exit 1; }

          usage() {
            die "usage: caplv-hostctl {mkdir|write|rm|exists|mount-tmpfs|umount} <path> [arg]"
          }

          # Canonicalise PATH and require the result to stay under $BASE.
          # realpath -m resolves '..' and any symlinked component without
          # requiring the leaf to exist, so neither traversal nor a planted
          # symlink can point the operation outside the CAPLV directory.
          resolve() {
            local raw=$1 canon
            [[ $raw == /* ]] || die "path must be absolute: $raw"
            canon=$(realpath -m -- "$raw") || die "cannot resolve path: $raw"
            [[ $canon == "$BASE" || $canon == "$BASE"/* ]] \
              || die "refusing to operate outside $BASE: $raw -> $canon"
            printf '%s' "$canon"
          }

          ensure_base() {
            install -d -m 0755 -o root -g root -- "$BASE"
          }

          [[ $# -ge 2 ]] || usage
          action=$1
          target=$(resolve "$2")

          case $action in
            mkdir)
              [[ $# -eq 2 ]] || usage
              ensure_base
              install -d -m "$DIR_MODE" -o "$OWNER" -g "$GROUP" -- "$target"
              ;;
            write)
              [[ $# -eq 2 ]] || usage
              # Create with the intended mode before any bytes land, so the
              # payload is never briefly world-readable, then overwrite in
              # place — the redirect truncates but keeps the mode.
              #
              # In session mode the containing directory is owned by the service
              # account (the per-user libvirt daemon creates volume files there),
              # so it could plant a symlink between the resolve above and the
              # write below. Dropping to that account for the write closes the
              # race: following such a symlink then grants no more than the
              # account already has. In system mode the directory is root-owned
              # and unwritable by the service account, so no race exists.
              if [[ $LIBVIRT_MODE == session ]]; then
                runuser -u "$CAPLV_USER" -- install -m "$FILE_MODE" /dev/null "$target"
                runuser -u "$CAPLV_USER" -- tee "$target" > /dev/null
              else
                install -m "$FILE_MODE" -o "$OWNER" -g "$GROUP" /dev/null "$target"
                cat > "$target"
              fi
              ;;
            rm)
              [[ $# -eq 2 ]] || usage
              rm -f -- "$target"
              ;;
            exists)
              [[ $# -eq 2 ]] || usage
              # The artifact directories are not world-traversable any more, so
              # the service account cannot stat them directly.
              if [[ -e $target ]]; then echo present; else echo missing; fi
              ;;
            mount-tmpfs)
              [[ $# -le 3 ]] || usage
              # A bare `mount -t tmpfs` leaves the mount root 1777 (tmpfs's
              # default), i.e. world-writable, so uid/gid/mode are always set.
              opts="mode=$DIR_MODE"
              if [[ $LIBVIRT_MODE == session ]]; then
                uid=$(id -u -- "$CAPLV_USER") || die "no such user: $CAPLV_USER"
                gid=$(id -g -- "$CAPLV_USER") || die "no such user: $CAPLV_USER"
              else
                uid=0
                gid=$(getent group qemu | cut -d: -f3)
                [[ -n $gid ]] || die "group 'qemu' does not exist; is qemu-kvm installed?"
              fi
              opts+=",uid=$uid,gid=$gid"
              if [[ $# -eq 3 && -n $3 ]]; then
                # tmpfs size= syntax only: a percentage, or a byte count with an
                # optional unit suffix. Anything else could smuggle in a second
                # mount option past the comma.
                [[ $3 =~ ^([1-9][0-9]?|100)%$|^[1-9][0-9]*[KMGTkmgt]?$ ]] \
                  || die "invalid tmpfs size: $3"
                opts+=",size=$3"
              fi
              ensure_base
              install -d -m "$DIR_MODE" -o "$OWNER" -g "$GROUP" -- "$target"
              mount -t tmpfs -o "$opts" tmpfs "$target"
              ;;
            umount)
              [[ $# -eq 2 ]] || usage
              umount -- "$target" 2>/dev/null || true
              rmdir -- "$target" 2>/dev/null || true
              ;;
            *)
              usage
              ;;
          esac
        dest: /usr/local/sbin/caplv-hostctl
        owner: root
        group: root
        mode: "0755"

    - name: Configure sudoers for caplv
      ansible.builtin.copy:
        content: |
          # CAPLV service account — sudo is limited to the helper below, which
          # validates its own arguments. Do not add wildcard path rules here:
          # a '*' in a sudoers command argument matches '/' and '..' as well,
          # so any such rule grants write access to the whole filesystem.
          {{ caplv_user }} ALL=(root) NOPASSWD: /usr/local/sbin/caplv-hostctl
        dest: "/etc/sudoers.d/{{ caplv_user }}"
        mode: "0440"
        validate: "visudo -cf %s"

    # ── Session mode (unprivileged libvirt) ───────────────────

    - name: Configure session mode
      when: libvirt_mode == 'session'
      block:
        # When core dumps are enabled libvirt sets the qemu process
        # core-file-size limit to unlimited; the unprivileged session daemon
        # cannot raise it above the account's hard limit, so a capped hard
        # limit fails VM start with "cannot limit core file size ...
        # Operation not permitted". Raise the hard limit to unlimited for
        # both entry paths of the session daemon: PAM logins (SSH-spawned)
        # and the lingering systemd user manager, which does not go through
        # the sshd PAM stack. This must precede enable-linger so the user
        # manager starts with the drop-in in place; on an already-lingering
        # host the manager keeps the old limit until the host (or
        # user@<uid>.service, killing its VMs) is restarted.
        - name: Raise core-dump hard limit for PAM sessions of the service account
          ansible.builtin.copy:
            content: |
              {{ caplv_user }} hard core unlimited
            dest: /etc/security/limits.d/90-caplv-core.conf
            mode: "0644"

        - name: Create user manager drop-in directory
          ansible.builtin.file:
            path: "/etc/systemd/system/user@{{ caplv_uid.stdout }}.service.d"
            state: directory
            mode: "0755"

        - name: Raise core-dump hard limit for the lingering user manager
          ansible.builtin.copy:
            content: |
              [Service]
              LimitCORE=infinity
            dest: "/etc/systemd/system/user@{{ caplv_uid.stdout }}.service.d/90-caplv-core.conf"
            mode: "0644"

        - name: Reload systemd for the user manager drop-in
          ansible.builtin.systemd:
            daemon_reload: true

        - name: Enable lingering so session VMs survive logout and autostart
          ansible.builtin.command: loginctl enable-linger {{ caplv_user }}
          changed_when: true

        - name: Make qemu-bridge-helper setuid so unprivileged QEMU can attach taps to whitelisted bridges
          ansible.builtin.file:
            path: "{{ bridge_helper_path }}"
            owner: root
            group: root
            mode: "4755"

        # Fedora reads /etc/qemu/bridge.conf, RHEL's qemu-kvm build reads
        # /etc/qemu-kvm/bridge.conf — write both.
        - name: Create qemu bridge ACL directories
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            mode: "0755"
          loop:
            - /etc/qemu
            - /etc/qemu-kvm

        - name: Whitelist bridges for qemu-bridge-helper
          ansible.builtin.copy:
            content: |
              {% for bridge in session_allowed_bridges %}
              allow {{ bridge }}
              {% endfor %}
            dest: "{{ item }}/bridge.conf"
            mode: "0644"
          loop:
            - /etc/qemu
            - /etc/qemu-kvm

        - name: Ensure session storage parent directories are owned by the service account
          ansible.builtin.file:
            path: "/home/{{ caplv_user }}/{{ item }}"
            state: directory
            owner: "{{ caplv_user }}"
            group: "{{ caplv_user }}"
            mode: "0755"
          loop:
            - .local
            - .local/share
            - .local/share/libvirt

    # In session mode virsh must run as the service account against its
    # per-user daemon; XDG_RUNTIME_DIR points at the lingering user runtime
    # dir so the daemon can be auto-spawned.
    - name: Set virsh command for the selected mode
      ansible.builtin.set_fact:
        virsh: >-
          {{ 'virsh -c qemu:///system'
             if libvirt_mode == 'system'
             else 'runuser -u ' + caplv_user + ' -- env XDG_RUNTIME_DIR=/run/user/' + caplv_uid.stdout + ' virsh -c qemu:///session' }}

    # ── Storage pool ──────────────────────────────────────────

    - name: Ensure storage pool directory exists
      ansible.builtin.file:
        path: "{{ storage_pool_path }}"
        state: directory
        mode: "0711"
        owner: "{{ caplv_user if libvirt_mode == 'session' else omit }}"
        group: "{{ caplv_user if libvirt_mode == 'session' else omit }}"

    - name: List existing storage pools
      ansible.builtin.command: "{{ virsh }} pool-list --all --name"
      register: pool_list
      changed_when: false

    - name: Find pool using our storage path
      ansible.builtin.shell: |
        for pool in $({{ virsh }} pool-list --all --name | grep -v '^$'); do
          path=$({{ virsh }} pool-dumpxml "$pool" 2>/dev/null | grep -oP '(?<=<path>).*(?=</path>)')
          if [ "$path" = "{{ storage_pool_path }}" ]; then
            echo "$pool"
            exit 0
          fi
        done
        echo ""
      register: existing_pool
      changed_when: false

    - name: Set storage pool name
      ansible.builtin.set_fact:
        libvirt_pool_name: "{{ existing_pool.stdout | trim | default('default', true) }}"

    - name: Define storage pool if none uses this path
      ansible.builtin.command: >
        {{ virsh }} pool-define-as {{ libvirt_pool_name }} dir --target {{ storage_pool_path }}
      when: existing_pool.stdout | trim == ""

    - name: Ensure storage pool is started
      ansible.builtin.command: "{{ virsh }} pool-start {{ libvirt_pool_name }}"
      register: pool_start
      changed_when: pool_start.rc == 0
      failed_when: false

    - name: Ensure storage pool autostarts
      ansible.builtin.command: "{{ virsh }} pool-autostart {{ libvirt_pool_name }}"
      changed_when: false
      failed_when: false

    # ── Base image ────────────────────────────────────────────

    - name: Check if base image exists
      ansible.builtin.stat:
        path: "{{ storage_pool_path }}/{{ base_image_name }}"
      register: base_image_stat
      when: stage_base_image | bool

    - name: Download and decompress base image
      ansible.builtin.shell: |
        curl -fL "{{ base_image_url }}" | gunzip > "{{ storage_pool_path }}/{{ base_image_name }}"
        chmod 644 "{{ storage_pool_path }}/{{ base_image_name }}"
      when:
        - stage_base_image | bool
        - not base_image_stat.stat.exists

    - name: Refresh storage pool
      ansible.builtin.command: "{{ virsh }} pool-refresh {{ libvirt_pool_name }}"
      changed_when: false
      when: stage_base_image | bool

    # ── Verification ──────────────────────────────────────────

    - name: Verify libvirtd is running
      ansible.builtin.command: "{{ virsh }} version"
      changed_when: false

    # Connect the way Ansible did: the host's own default address need not
    # be reachable from here (cloud instances, NAT, jump hosts).
    - name: Test SSH connectivity as caplv user
      ansible.builtin.command: >
        ssh -i {{ ssh_key_path }}
        -o IdentitiesOnly=yes
        -o StrictHostKeyChecking=no
        -o UserKnownHostsFile=/dev/null
        {{ caplv_user }}@{{ ansible_host | default(inventory_hostname) }}
        virsh -c qemu:///{{ libvirt_mode }} version
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Get SSH host key fingerprint
      ansible.builtin.command: ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub
      register: host_key
      changed_when: false

    - name: Extract fingerprint
      ansible.builtin.set_fact:
        ssh_fingerprint: "{{ host_key.stdout.split(' ')[1] }}"

    - name: List base images in pool
      ansible.builtin.command: "{{ virsh }} vol-list {{ libvirt_pool_name }}"
      register: vol_list
      changed_when: false

    - name: Display setup summary
      ansible.builtin.debug:
        msg:
          - ""
          - "═══════════════════════════════════════════════════════════"
          - "  CAPLV host setup complete"
          - "═══════════════════════════════════════════════════════════"
          - ""
          - "  SSH private key:  {{ ssh_key_path }}"
          - "  SSH fingerprint:  {{ ssh_fingerprint }}"
          - "  Host IP:          {{ ansible_default_ipv4.address }}"
          - ""
          - "  Storage pool volumes:"
          - "{{ vol_list.stdout }}"
          - ""
          - "  ── Create the K8s Secret ──"
          - ""
          - "  kubectl create secret generic laptop-ssh-key \\"
          - "    --from-file=ssh-privatekey={{ ssh_key_path }}"
          - ""
          - "  ── Apply this LibvirtHost ──"
          - ""
          - "  apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1"
          - "  kind: LibvirtHost"
          - "  metadata:"
          - "    name: laptop"
          - "  spec:"
          - "    uri: \"qemu+ssh://{{ caplv_user }}@{{ ansible_default_ipv4.address }}/{{ libvirt_mode }}\""
          - "    secretRef:"
          - "      name: laptop-ssh-key"
          - "    hostKeyFingerprint: \"{{ ssh_fingerprint }}\""
          - ""
          - "═══════════════════════════════════════════════════════════"
